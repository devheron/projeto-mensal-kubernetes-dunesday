# Banco de dados. Uma replica apenas: o PVC e ReadWriteOnce.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-mongo
  labels:
    app: todo-mongo
    app.kubernetes.io/part-of: dunesday
spec:
  replicas: 1
  # O PVC e ReadWriteOnce e o mongod tranca /data/db enquanto roda.
  # Com RollingUpdate o Pod novo sobe antes do antigo morrer, encontra o
  # lock preso e sai na hora. Recreate derruba o antigo primeiro.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-mongo
  template:
    metadata:
      labels:
        app: todo-mongo
    spec:
      containers:
        - name: mongo
          image: todo-mongo:latest
          # A imagem foi construida no daemon do Minikube e nao existe em
          # registry nenhum. Sem isto o Pod cai em ImagePullBackOff.
          imagePullPolicy: Never
          ports:
            - containerPort: 27017
              name: mongo
          env:
            # Credenciais vem do Secret, nunca deste arquivo
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: MONGO_DB_NAME
          volumeMounts:
            - name: data
              mountPath: /data/db
          # Checagem de porta em vez de mongosh: o cliente e Node e sobe em
          # segundos, o que torna a probe lenta e sujeita a estourar tempo.
          # A conexao autenticada de verdade e verificada pelo /health do
          # backend, que e quem precisa falar com o banco.
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
