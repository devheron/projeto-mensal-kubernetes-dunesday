# Modelo do Secret. O arquivo real fica fora do Git.
#
# Crie por linha de comando, sem gravar credencial em arquivo nenhum:
#
#   kubectl create secret generic mongo-secret \
#     --from-literal=MONGO_USER='SEU_USUARIO' \
#     --from-literal=MONGO_PASSWORD='SUA_SENHA' \
#     --from-literal=MONGO_URI='mongodb://SEU_USUARIO:SUA_SENHA@todo-mongo:27017/todo-app?authSource=admin'
#
# As tres chaves precisam existir: o Deployment do banco usa as duas primeiras
# para criar o usuario root, e o backend usa a terceira para conectar.
#
# O .gitignore da raiz ignora k8s/*secret*.yaml e versiona apenas este modelo.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  labels:
    app.kubernetes.io/part-of: dunesday
type: Opaque
stringData:
  MONGO_USER: "SEU_USUARIO"
  MONGO_PASSWORD: "SUA_SENHA"
  MONGO_URI: "mongodb://SEU_USUARIO:SUA_SENHA@todo-mongo:27017/todo-app?authSource=admin"
