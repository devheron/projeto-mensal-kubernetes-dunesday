# Unico ponto exposto para fora do cluster.
# Abre com: minikube service todo-frontend
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  labels:
    app: todo-frontend
spec:
  type: NodePort
  selector:
    app: todo-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      name: http
